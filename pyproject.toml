[project]
name = "golden-lap-zh"
dynamic = ["version"]
description = "Golden Lap 简体中文汉化安装器"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
